<div class="container">

  </div>

  <div class="filter-bar">
    <div class="filter-row">
      <input type="text" id="searchInput" placeholder="Rechercher..." oninput="render()">
      <select id="platFilter" onchange="render()"><option value="">Toutes plateformes</option></select>
      <div class="year-slider-wrap">
        <label>Année</label>
        <input type="range" id="yearSlider" min="2011" max="2026" value="2026" oninput="render()">
        <span class="slider-value" id="yearDisplay">Tout</span>
      </div>
      <select id="progressFilter" onchange="render()">
        <option value="">Toute progression</option>
        <option value="Acquis">Acquis ✓</option>
        <option value="Planifié">Planifié ○</option>
      </select>
      <span class="count" id="resultCount"></span>
    </div>
  </div>

  <div class="collapse-bar">
    <button class="btn-collapse-all" onclick="toggleAll()">⊞ Tout ouvrir / Tout fermer</button>
  </div>

  <div class="formations-grid" id="formationsContainer"></div>

  <div class="footer">
    <span>Données du profil <strong>Amaury Van Espen</strong> · <span id="footerUpdate"></span></span>
    <a href="https://github.com/AmauryVanEspen/online-resumes" target="_blank" class="btn-refresh">↻ Voir sur GitHub</a>
  </div>

<script>
(function() {
  if (typeof data === 'undefined' || !data.allCertificates) {
    document.getElementById('formationsContainer').innerHTML = '<div class="empty-state">Données non disponibles.</div>';
    return;
  }

  var certs = data.allCertificates;
  var gaps = data.progressGaps || [];
  var allCollapsed = false;

  // Collect issuers and years
  var issuers = [], issuerSet = {}, years = [], yearSet = {};
  certs.forEach(function(c) {
    if (c.issuer && !issuerSet[c.issuer]) { issuerSet[c.issuer] = true; issuers.push(c.issuer); }
    if (c.year && !yearSet[c.year]) { yearSet[c.year] = true; years.push(c.year); }
  });
  issuers.sort(); years.sort();

  var pSel = document.getElementById('platFilter');
  issuers.forEach(function(i) { var o = document.createElement('option'); o.value = i; o.textContent = i; pSel.appendChild(o); });

  var minYear = years.length ? parseInt(years[0],10) : 2011;
  var maxYear = years.length ? parseInt(years[years.length-1],10) : 2026;

  var slider = document.getElementById('yearSlider');
  slider.min = minYear; slider.max = maxYear; slider.value = maxYear;
  var yearDisp = document.getElementById('yearDisplay');

  // Progress: all certs are "Acquis" by default (completed)
  var progressMap = {};
  certs.forEach(function(c) { progressMap[c.title + '|' + c.issuer] = 'Acquis'; });

  // Add planned items from progressGaps (only unique ones not already in certs)
  gaps.forEach(function(g) {
    var key = g.action + '|Recommandation';
    if (!progressMap[key]) progressMap[key] = 'Planifié';
  });

  var issuerColors = { 'SAP':'#0a6e33','SAP / openSAP':'#0a6e33','Skillsoft':'#6c5ce7','Pearson':'#00b894','ETS Global':'#e74c3c','DataCamp':'#e17055','edX':'#02262a','UVHC - Université de Valenciennes et du Hainaut-Cambrésis':'#636e72','European Computer Driving Licence Foundation':'#fdcb6e' };
  var issuerOrder = ['SAP','SAP / openSAP','DataCamp','Skillsoft','Pearson','edX','UVHC - Université de Valenciennes et du Hainaut-Cambrésis','ETS Global','European Computer Driving Licence Foundation','Recommandation'];

  function googleLink(label) {
    return 'https://www.google.com/search?q=' + encodeURIComponent(label) + '&btnI=1';
  }

  window.toggleAll = function() {
    allCollapsed = !allCollapsed;
    document.querySelectorAll('.plat-body').forEach(function(b) { b.style.display = allCollapsed ? 'none' : 'block'; });
    document.querySelectorAll('.toggle-icon').forEach(function(i) { i.classList.toggle('open', !allCollapsed); });
  };

  window.render = function() {
    var q = document.getElementById('searchInput').value.toLowerCase();
    var plat = document.getElementById('platFilter').value;
    var sv = parseInt(slider.value, 10);
    var prog = document.getElementById('progressFilter').value;
    yearDisp.textContent = (sv >= maxYear) ? 'Tout' : (minYear + '–' + sv);

    // Build item list: certs + planned recommendations
    var items = certs.map(function(c) {
      return { year: c.year, title: c.title, issuer: c.issuer, url: c.url, code: c.code,
        status: progressMap[c.title + '|' + c.issuer] || 'Acquis', type: 'cert' };
    });
    // Add planned items from gaps
    gaps.forEach(function(g) {
      var key = g.action + '|Recommandation';
      if (progressMap[key] === 'Planifié') {
        items.push({ year: '', title: g.action, issuer: 'Recommandation', url: '',
          code: '', status: 'Planifié', type: 'planned', domain: g.domain, priority: g.priority });
      }
    });

    var filtered = items.filter(function(c) {
      if (plat && c.issuer !== plat) return false;
      if (prog && c.status !== prog) return false;
      var cy = parseInt(c.year, 10);
      if (!isNaN(cy) && cy > sv) return false;
      if (q) {
        var h = (c.title + ' ' + c.issuer + ' ' + c.year + ' ' + (c.code||'') + ' ' + (c.url||'')).toLowerCase();
        if (h.indexOf(q) < 0) return false;
      }
      return true;
    });

    document.getElementById('resultCount').textContent = filtered.length + ' / ' + items.length;
    document.getElementById('subHeader').textContent = items.length + ' formations (' + certs.length + ' acquises, ' + gaps.length + ' planifiées)';
    document.getElementById('footerUpdate').textContent = 'Dernière màj : ' + (data.generated || '?');

    var container = document.getElementById('formationsContainer');
    container.innerHTML = '';
    if (!filtered.length) { container.innerHTML = '<div class="empty-state">Aucune formation trouvée</div>'; return; }

    // Group by issuer
    var byIssuer = {};
    filtered.forEach(function(c) {
      var i = c.issuer || 'Inconnu';
      if (!byIssuer[i]) byIssuer[i] = [];
      byIssuer[i].push(c);
    });

    var sortedIssuers = Object.keys(byIssuer).sort(function(a,b) {
      var ai = issuerOrder.indexOf(a), bi = issuerOrder.indexOf(b);
      return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
    });

    sortedIssuers.forEach(function(iss) {
      var items2 = byIssuer[iss].sort(function(a,b) { return ((b.year||'') > (a.year||'')) ? 1 : -1; });
      var color = issuerColors[iss] || '#95a5a6';
      var withUrl = items2.filter(function(c) { return c.url && c.url.length > 5; }).length;
      var acquired = items2.filter(function(c) { return c.status === 'Acquis'; }).length;
      var pct = items2.length ? Math.round(acquired / items2.length * 100) : 0;

      var block = document.createElement('div');
      block.className = 'plat-block';

      var tableHtml = '<table><thead><tr><th style="width:35px;">Année</th><th>Formation</th><th style="width:65px;">Progression</th></tr></thead><tbody>';
      items2.forEach(function(c) {
        var sClass = c.status === 'Acquis' ? 'completed' : (c.status === 'En cours' ? 'in-progress' : 'planned');
        var linkUrl, linkTitle;
        if (c.type === 'planned') {
          linkUrl = googleLink(c.title);
          linkTitle = "Google J'ai de la chance";
        } else if (c.url && c.url.length > 5) {
          linkUrl = c.url;
          linkTitle = 'Lien original';
        } else {
          linkUrl = googleLink(c.title + ' ' + c.issuer);
          linkTitle = 'Google';
        }

        tableHtml += '<tr>' +
          '<td style="font-weight:600;color:' + color + ';font-size:11px;">' + (c.year || '—') + '</td>' +
          '<td>' + (c.code ? '<span class="code-badge">' + c.code + '</span> ' : '') +
            '<a href="' + linkUrl + '" target="_blank" title="' + linkTitle + '" style="font-size:12px;color:#1a1a2e;text-decoration:none;border-bottom:1px dotted #bbb;" data-verify="1" data-type="course" data-title="' + c.title + '" data-issuer="' + c.issuer + '">' + c.title + '</a>' +
            (c.type === 'planned' ? ' <span style="font-size:10px;color:#e65100;">(Planifié)</span>' : '') + '</td>' +
          '<td><div style="display:flex;align-items:center;gap:4px;">' +
            '<div style="flex:1;height:3px;background:#eee;border-radius:2px;overflow:hidden;">' +
            '<div style="height:3px;width:' + (c.status === 'Acquis' ? 100 : c.status === 'En cours' ? 50 : 0) + '%;background:' + (c.status === 'Acquis' ? '#0a6e33' : c.status === 'En cours' ? '#f39c12' : '#95a5a6') + ';border-radius:2px;"></div></div>' +
            '<span class="progress-label ' + sClass + '">' + (c.status === 'Acquis' ? '✓' : c.status === 'En cours' ? '◷' : '○') + '</span>' +
          '</div></td></tr>';
      });
      tableHtml += '</tbody></table>';

      block.innerHTML =
        '<div class="plat-header" onclick="toggleOne(this)">' +
          '<div><h2 style="color:'+color+'">'+iss+'</h2><div class="stat">'+items2.length+' formations · '+withUrl+' liens · <strong>'+pct+'%</strong> acquises</div></div>' +
          '<span class="toggle-icon open">▼</span></div>' +
        '<div class="plat-body">'+tableHtml+'</div>';
      container.appendChild(block);
    });
  }

  window.toggleOne = function(header) {
    var body = header.nextElementSibling;
    var icon = header.querySelector('.toggle-icon');
    if (!body) return;
    body.style.display = body.style.display === 'none' ? 'block' : 'none';
    if (icon) icon.classList.toggle('open');
  };

  render();
})();
</script>
</body>
</html>
